<p-toast />
<loader/>
<p-fluid >
    <div class="flex flex-col md:flex-row gap-8 mt-8">
        <div class="md:w-1/2">
            <div class="card">
                <div class="font-semibold text-xl"><b>{{'Available Employee Roles' | translate}}</b>
                    <div style="float: right;">
                        <p-button size="small" variant="outlined" raised="true" (click)="op.toggle($event)" icon="pi pi-plus" [label]="'New Role' | translate"/>
                        <p-popover #op>
                            <div class="flex flex-col">
                                <div>
                                    <span class="font-medium text-surface-900 dark:text-surface-0 block mb-2">{{'Create New Role' | translate}}</span>
                                    <div class="flex">
                                        <p-inputGroup class="bottom-margin">
                                            <p-floatLabel variant="in">
                                            <input id="rolename" type="text" pInputText [(ngModel)]="newRoleName"/>
                                                <label for="rolename">{{'Role Name' | translate}}</label>
                                                <p-inputgroup-addon>
                                                    <p-button icon="pi pi-save" variant="text" (click)="createRole(); op.toggle($event)" [label]="'Save' | translate" />
                                                </p-inputgroup-addon>
                                            </p-floatLabel>
                                          </p-inputGroup>
                                    </div>
                                </div>
                            </div>
                        </p-popover>
                    </div>
                </div> <br/>
                <p-panelmenu [model]="items" [style]="{'width':'300px'}" [multiple]="true" />
            </div>
        </div>
        <div class="md:w-1/2">
            <div class="card">
                <div class="font-semibold text-xl"><b>{{'Assign permission(s) to Roles' | translate}}</b></div>
                <br/>
                <div class="justify-center">
                    <p-select [options]="roles" [(ngModel)]="selectedRole" optionLabel="rolename"
                              [showClear]="true" [placeholder]="'Select a Role' | translate" (onChange)="updatePermissionsPickList()"/>
                    <!-- <p-select 
                        [options]="roles" 
                        [(ngModel)]="selectedRole" 
                        [showClear]="true" 
                        [placeholder]="'Select a Role' | translate" 
                        (onChange)="updatePermissionsPickList()">
                        <ng-template let-role pTemplate="item">
                        {{ role.rolename | translate }}
                        </ng-template>
                        <ng-template let-role pTemplate="selectedItem">
                        {{ role?.rolename | translate }}
                        </ng-template>
                    </p-select> -->
                </div>
                <br/>
                <div>
                    <p-message severity="info" icon="pi pi-info">{{ 'Slide or drag right to assign permissions' | translate}}</p-message>
                    <br/>
                    <p-picklist #pickListRef [source]="sourcePermissions" [target]="targetPermissions" 
                        (onMoveToTarget)="onPermissionSelect($event)"
                        (onMoveToSource)="onPermissionRemove($event)"
                        (onMoveAllToTarget)="onSelectAllPermission($event)"
                        (onMoveAllToSource)="onRemoveAllPermission($event)"
                        [dragdrop]="true" [responsive]="true" 
                        [sourceStyle]="{ height: '30rem' }" [targetStyle]="{ height: '30rem' }" 
                        [sourceHeader]="'Available Permissions' | translate" 
                        [targetHeader]="'Allocated Permissions' | translate" 
                        breakpoint="1400px"
                        scrollHeight="30rem">
                            <ng-template let-item #item>
                                {{ item.name | translate }}
                            </ng-template>
                    </p-picklist>
                </div>
            </div>
        </div>            
    </div>

    
</p-fluid>
